<html lang="en" th:replace="~{common/skeleton :: base(~{::section})}" xmlns:th="http://www.thymeleaf.org">

<section>
	<div class="container-fluid">
		<div class="row">
			<main class="col-md-12 ms-sm-auto px-md-4">
				<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3">
					<h1 class="h2">My Cohorts</h1>
					<a class="btn btn-primary" href="#" role="button" th:href="@{/cohort/create}">Create New Cohort</a>
				</div>
				<div class="row">
					<div class="col-md-4" th:each="cohort : ${cohorts}">
						<div class="card mb-4 shadow-sm">
							<div class="card-body">
								<h5 class="card-title" th:text="${cohort.name}"></h5>
								<p class="card-text">
									Creation Date: <span th:text="${cohort.creationDate}"></span>
								</p>
								<p class="card-text">
									Members: <span th:text="${cohort.sizeMembers}">0</span>
								</p>
							</div>
							<div class="d-flex justify-content-between m-2 p-2">
								<a th:href="@{/cohort/detail(id=${cohort.id})}" class="btn btn-primary">Details</a>
								<a th:href="@{/cohort/assign(id=${cohort.id})}" class="btn btn-primary">Assign Quiz</a>
							</div>
						</div>
					</div>
				</div>
			</main>
		</div>
	</div>
</section>

</html>
